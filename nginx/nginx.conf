worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_public:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m   rate=10r/m;

    server {
        listen 80;
        server_name _;

        # Redirect HTTP to HTTPS (enable when TLS cert is available)
        # return 301 https://$host$request_uri;

        # Serve React SPA static files
        root /var/www/handloom/frontend/dist;
        index index.html;

        # Public API — rate limited
        location /api/v1/applications/track {
            limit_req zone=api_public burst=5 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Auth endpoints — stricter rate limit
        location ~ ^/api/v1/auth/ {
            limit_req zone=api_auth burst=3 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # All other API calls
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            client_max_body_size 10M;
        }

        # SPA fallback — all unknown routes serve index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # HTTPS server block (uncomment when TLS cert is ready)
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #     ssl_certificate     /etc/ssl/certs/handloom.crt;
    #     ssl_certificate_key /etc/ssl/private/handloom.key;
    #     ssl_protocols TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ...
    # }
}

