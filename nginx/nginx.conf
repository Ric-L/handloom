worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_public:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_admin:10m  rate=60r/m;

    server {
        listen 80;
        server_name _;

        # Serve React SPA static files
        root /var/www/handloom/frontend/dist;
        index index.html;

        # Public tracking API — rate limited to prevent brute force enumeration
        location /api/v1/applications/track {
            limit_req zone=api_public burst=5 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Auth and login endpoints — strict rate limit
        location ~ ^/api/v1/(auth|admin/auth)/ {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Admin moderation endpoints
        location /api/v1/admin/ {
            limit_req zone=api_admin burst=20 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # All other API calls
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            client_max_body_size 10M;
        }

        # SPA fallback — all unknown routes serve index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
