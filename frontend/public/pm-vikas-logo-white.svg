<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 92" width="540" height="92" fill="none">
  <defs>
    <linearGradient id="logoBgGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="saffronW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF671F" />
    </linearGradient>
    <linearGradient id="greenW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#046A38" />
    </linearGradient>
  </defs>

  <!-- Left: PM VIKAS Circular Badge -->
  <g transform="translate(6, 6)">
    <!-- Outer Ring -->
    <circle cx="40" cy="40" r="39" fill="url(#logoBgGradW)" stroke="#38bdf8" stroke-width="1.2" />
    <!-- Saffron & Green Arcs -->
    <path d="M 6 40 A 34 34 0 0 1 74 40" fill="none" stroke="url(#saffronW)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 74 40 A 34 34 0 0 1 6 40" fill="none" stroke="url(#greenW)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Inner Circle -->
    <circle cx="40" cy="40" r="31" fill="#020617" stroke="url(#goldGradW)" stroke-width="1" />
    
    <!-- Central Chakra & Heritage Silhouette -->
    <circle cx="40" cy="33" r="16" fill="#0f1e42" stroke="#38bdf8" stroke-width="0.8" opacity="0.8" />
    <circle cx="40" cy="33" r="3" fill="#38bdf8" />
    <!-- Loom Shape -->
    <path d="M 40 20 L 46 30 L 43 30 L 46 38 L 34 38 L 37 30 L 34 30 Z" fill="url(#goldGradW)" />
    <!-- Warp threads -->
    <path d="M 32 37 L 48 37 L 46 43 L 34 43 Z" fill="#fef08a" opacity="0.9" />
    <line x1="36" y1="37" x2="36" y2="43" stroke="#b45309" stroke-width="0.8" />
    <line x1="40" y1="37" x2="40" y2="43" stroke="#b45309" stroke-width="0.8" />
    <line x1="44" y1="37" x2="44" y2="43" stroke="#b45309" stroke-width="0.8" />
    <!-- Bottom Ribbon -->
    <rect x="10" y="55" width="60" height="15" rx="7.5" fill="url(#goldGradW)" />
    <rect x="11.5" y="56.5" width="57" height="12" rx="6" fill="#020617" />
    <text x="40" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" fill="#fef08a" letter-spacing="1">
      PM VIKAS
    </text>
  </g>

  <!-- Vertical Divider Strip -->
  <line x1="98" y1="14" x2="98" y2="78" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />

  <!-- Typography Suite (White / Light theme for dark backgrounds) -->
  <!-- Top: Hindi Scheme Title with Badge -->
  <text x="112" y="26" font-family="'Segoe UI', Roboto, 'Noto Sans Devanagari', sans-serif" font-size="14.5" font-weight="800" fill="#f8fafc" letter-spacing="0.2">
    पीएम VIKAS <tspan font-weight="600" fill="#cbd5e1" font-size="13">| प्रधानमंत्री विरासत का संवर्धन</tspan>
  </text>

  <!-- Middle: English Scheme Title (Prominent Bold Sky/White) -->
  <text x="112" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#38bdf8" letter-spacing="-0.3">
    Pradhan Mantri Virasat Ka Samvardhan
  </text>

  <!-- Subtitle: Ministry & Govt. of India Details -->
  <g transform="translate(112, 57)">
    <!-- Ministry of Minority Affairs Tag -->
    <rect x="0" y="4" width="168" height="18" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="0.8" />
    <text x="8" y="16.5" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#93c5fd">
      Ministry of Minority Affairs
    </text>

    <!-- Government of India Authority -->
    <rect x="176" y="4" width="138" height="18" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
    <text x="184" y="16.5" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#cbd5e1">
      Government of India
    </text>

    <!-- Skill & Artisan Badge -->
    <rect x="322" y="4" width="96" height="18" rx="4" fill="#78350f" stroke="#b45309" stroke-width="0.8" />
    <text x="330" y="16.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#fef08a">
      Skilling Portal
    </text>
  </g>
</svg>