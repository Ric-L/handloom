<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#091428" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF671F" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#046A38" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Protective Base -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="1.5" />

  <!-- Tricolor Trim Ring -->
  <!-- Top Arc: Saffron -->
  <path d="M 10 64 A 54 54 0 0 1 118 64" fill="none" stroke="url(#saffronGrad)" stroke-width="4.5" stroke-linecap="round" />
  <!-- Bottom Arc: Green -->
  <path d="M 118 64 A 54 54 0 0 1 10 64" fill="none" stroke="url(#greenGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Inner Navy Disc -->
  <circle cx="64" cy="64" r="50" fill="#0b1329" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Central Ashoka Chakra Motif (24 spokes represented with subtle spokes) -->
  <circle cx="64" cy="52" r="26" fill="#0f1e42" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
  <circle cx="64" cy="52" r="5" fill="#38bdf8" />
  <!-- Spokes -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.6">
    <line x1="64" y1="26" x2="64" y2="78" />
    <line x1="38" y1="52" x2="90" y2="52" />
    <line x1="45.6" y1="33.6" x2="82.4" y2="70.4" />
    <line x1="45.6" y1="70.4" x2="82.4" y2="33.6" />
    <line x1="50.6" y1="29.5" x2="77.4" y2="74.5" />
    <line x1="77.4" y1="29.5" x2="50.6" y2="74.5" />
    <line x1="41.5" y1="42.6" x2="86.5" y2="61.4" />
    <line x1="41.5" y1="61.4" x2="86.5" y2="42.6" />
  </g>

  <!-- Golden Artisan Emblem / Heritage Loom & Craft Motif in Foreground -->
  <g filter="url(#glow)">
    <!-- Loom Frame / Temple Tower Silhouette in Golden Accent -->
    <path d="M 64 30 L 74 46 L 68 46 L 73 58 L 55 58 L 60 46 L 54 46 Z" fill="url(#goldGrad)" />
    <!-- Handloom Warp Threads -->
    <path d="M 50 56 L 78 56 L 75 66 L 53 66 Z" fill="#fef08a" opacity="0.9" />
    <line x1="56" y1="56" x2="56" y2="66" stroke="#b45309" stroke-width="1" />
    <line x1="60" y1="56" x2="60" y2="66" stroke="#b45309" stroke-width="1" />
    <line x1="64" y1="56" x2="64" y2="66" stroke="#b45309" stroke-width="1" />
    <line x1="68" y1="56" x2="68" y2="66" stroke="#b45309" stroke-width="1" />
    <line x1="72" y1="56" x2="72" y2="66" stroke="#b45309" stroke-width="1" />
    <!-- Artisan Tools Accent (Chisel & Shuttle cross) -->
    <path d="M 46 64 L 82 64 L 79 70 L 49 70 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Bottom Ribbon / Label Pill for PM VIKAS -->
  <rect x="18" y="86" width="92" height="24" rx="12" fill="url(#goldGrad)" filter="url(#glow)" />
  <rect x="20" y="88" width="88" height="20" rx="10" fill="#091428" />

  <!-- PM VIKAS Crisp Text -->
  <text x="64" y="103" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#fef08a" letter-spacing="1.5">
    PM VIKAS
  </text>
  
  <!-- Subtle decorative stars -->
  <circle cx="27" cy="98" r="1.5" fill="#38bdf8" />
  <circle cx="101" cy="98" r="1.5" fill="#38bdf8" />
</svg>